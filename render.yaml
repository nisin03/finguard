services:
  - type: web
    name: expense-service
    runtime: docker
    dockerfilePath: ./expense-service/Dockerfile
    dockerContext: ./expense-service
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        sync: false
