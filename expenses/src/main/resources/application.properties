spring.application.name=expenses
spring.datasource.url=jdbc:postgresql://localhost:5432/finguard
spring.datasource.username=finguard_user
spring.datasource.password=finguard_pass

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.finguard=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}