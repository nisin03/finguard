services:
  postgres:
    image: postgres:16
    container_name: finguard-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finguard}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finguard-network

  expense-service:
    build:
      context: ./expense-service
      dockerfile: Dockerfile
    container_name: finguard-expense-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:-finguard}"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - '8080:8080'
    networks:
      - finguard-network

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: finguard-parser-service
    ports:
      - '8000:8000'
    networks:
      - finguard-network

volumes:
  postgres_data:

networks:
  finguard-network:
